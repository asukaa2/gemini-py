[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-py"
version = "0.4.1"
description = "Python SDK and CLI for Google Gemini — a Python port of google-gemini/gemini-cli (headless/CLI-only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "gemini-py contributors" }]
keywords = ["gemini", "google", "ai", "cli", "sdk", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]
vertex = [
    "google-auth>=2.20.0",
]

[project.scripts]
gemini-py = "gemini_py.cli:main"
gemini = "gemini_py.cli:main"

[project.urls]
Homepage = "https://github.com/google-gemini/gemini-cli"
Repository = "https://github.com/google-gemini/gemini-cli"
Documentation = "https://developers.google.com/gemini"

[tool.setuptools.packages.find]
where = ["."]
include = ["gemini_py*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
